name: Daily NBA Pipeline

on:
  schedule:
    # 3:00 PM ET = 8:00 PM UTC (during EDT, Mar-Nov)
    - cron: '0 20 * * *'
  workflow_dispatch:  # Manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore model cache
        uses: actions/cache@v4
        with:
          path: |
            models/
            data/injury_cache.csv
          key: nba-models-${{ github.run_number }}
          restore-keys: |
            nba-models-

      - name: Run daily pipeline
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          mkdir -p logs reports
          echo "=== NBA Daily Pipeline - $(date) ==="
          python main.py --days-back 120 2>&1 | tee logs/pipeline_$(date +%Y%m%d).log
        continue-on-error: true

      - name: Send picks to Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            python notify_telegram.py logs/pipeline_$(date +%Y%m%d).log
          else
            echo "Telegram secrets not set — skipping notification"
          fi
        continue-on-error: true

      - name: Commit updated data & predictions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -f data/*.csv models/*.json reports/*.json logs/*.log 2>/dev/null || true
          git add -f predictions/ 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily pipeline run $(date +%Y-%m-%d)

          Automated by GitHub Actions"
            git push
          fi
